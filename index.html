<style>
:root{
  --bg:#f3f5f3; --surface:#ffffff; --fg:#18201d; --muted:#5c6964; --line:#d9e0dc;
  --accent:#0d6656; --accent-fg:#ffffff; --accent-soft:#dcefe9;
  --pass:#1d7a3e; --pass-soft:#dff3e6; --fail:#c0322b; --fail-soft:#fbe3e1;
  --wait:#9a6700; --wait-soft:#fdf0d2;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;

}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#1a211e; --fg:#e7eeea; --muted:#9aa8a2; --line:#2c3632;
  --accent:#3fb39b; --accent-fg:#06221c; --accent-soft:#16352e;
  --pass:#5fcf86; --pass-soft:#16301f; --fail:#ff7a70; --fail-soft:#3a1a18;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync.saving{color:var(--wait)}
.sync button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font:inherit;color:inherit;text-align:left;cursor:pointer}
.count b{display:block;font-family:var(--font-mono);font-size:18px;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
.count[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count.pass b{color:var(--pass)} .count.fail b{color:var(--fail)} .count.wait b{color:var(--wait)}

.scan{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer;min-height:44px}
.btn:focus-visible,.count:focus-visible,.ox:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:17px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.secondary{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none}
.export{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.export a{color:var(--accent);text-underline-offset:3px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
input[type=text],input[type=search]{font:inherit;font-family:var(--font-mono);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);min-height:44px}
.hint{font-size:12px;color:var(--muted);margin:0}
.progress{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600}

.tools{margin-top:20px;display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0}
.list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-left-width:4px}
.card.pass{border-left-color:var(--pass)} .card.fail{border-left-color:var(--fail)} .card.wait,.card.retest{border-left-color:var(--wait)}

@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ids{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;min-width:0}
.field{display:flex;flex-direction:column;min-width:0}

.field b{font-family:var(--font-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);font-family:var(--font-mono);overflow-wrap:anywhere}
.meta .saving{color:var(--wait);font-family:var(--font-body)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.pill.pass{background:var(--pass-soft);color:var(--pass)} .pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.wait,.pill.retest{background:var(--wait-soft);color:var(--wait)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.slot.O{background:var(--pass-soft)} .slot.O .mark{color:var(--pass)}
.slot.X{background:var(--fail-soft)} .slot.X .mark{color:var(--fail)}

.oxs{display:flex;gap:6px;width:100%}

.actions{display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.banner{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:8px;background:var(--wait-soft);color:var(--wait)}

.live{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}

.live .last{color:#fff;font-size:15px;text-align:center;min-height:22px}

.summary h2{margin:0;font-size:15px;font-weight:700}
.sumhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sumhead span{font-size:12px;color:var(--muted)}

.sumtable th:first-child,.sumtable td:first-child{text-align:left}
.sumtable td{text-align:right;padding:6px;border-bottom:1px solid var(--line);font-family:var(--font-mono);white-space:nowrap}
.sumtable tr.total td{font-weight:700;border-bottom:none}
.sumtable .p{color:var(--pass)} .sumtable .f{color:var(--fail)} .sumtable .w{color:var(--wait)}
.sumtable .zero{color:var(--muted);opacity:.6}
.btn.close-day{border-color:var(--fail);color:var(--fail);font-size:14px}
.rw{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;font-family:var(--font-body)}
.link.rework{color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}

.modal p{margin:0;font-size:15px}
.modal .btnrow .primary{font-size:15px;min-height:48px}
.live .ctrls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.live .ctrls span{display:flex;gap:6px}
.live .ctrls button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:6px 14px;font:inherit;font-weight:600;min-height:40px;cursor:pointer}
.live .ctrls button.on{background:#fff;color:#111}
.live .caminfo{color:rgba(255,255,255,.6);font-size:11px;text-align:center}
.live .focus-ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #ffd54a;border-radius:50%;pointer-events:none}
.live .top-hint small{font-size:12px;opacity:.85}
.live .top-hint{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1>샘플 입고 시험기록</h1><span class="sync" id="syncWrap"><span id="sync">연결 중…</span><button id="refresh" type="button" aria-label="새로고침">↻</button></span></div>
  <div class="counts" id="counts">
    <button class="count" data-f="all" aria-pressed="true"><b id="c-all">0</b><span>전체</span></button>
    <button class="count wait" data-f="todo" aria-pressed="false"><b id="c-todo">0</b><span>측정 대기</span></button>
    <button class="count pass" data-f="pass" aria-pressed="false"><b id="c-pass">0</b><span>PASS</span></button>
    <button class="count fail" data-f="fail" aria-pressed="false"><b id="c-fail">0</b><span>FAIL</span></button>

</div></header>

<main class="wrap">

      실시간 스캔 시작
    </button>
    <a class="btn primary" id="liveLink" href="#" target="_blank" rel="noopener" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M4 12h16"/></svg>
      실시간 스캔판 열기 ↗

    <div class="btnrow">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>

    <div class="btnrow">
      <button class="btn" type="button" id="closeCancel">취소</button>

<script>
(function(){
const MAX_TRIES = 3;
const $ = s => document.querySelector(s);
const IS_GAS = typeof google !== "undefined" && google.script && google.script.run;
const MODE = IS_GAS ? "gas" : (SCRIPT_URL ? "remote" : "demo");
let items = [], filter = "all", query = "", flashId = null;

/* ---------- 서버 호출 ---------- */
function callServer(req){
  if (MODE === "gas") return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
  if (MODE === "remote") return fetch(SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(req)})
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  return new Promise(r => setTimeout(() => r(demoApi(req)), 300));
}

/* 저장은 순서대로 뒤에서 처리하고, 화면은 바로 바꿈 (대기시간 없음) */
let chain = Promise.resolve(), pendingOps = 0, serverItems = null, opFailed = false;
function enqueue(req, onDone){
  pendingOps++; showSync();
  chain = chain.then(() => callServer(req)).then(res => {
    if (res && res.items) serverItems = res.items;
    if (res && !res.ok && res.msg && !res.dup) toast(res.msg);
    if (onDone) onDone(res);
  }).catch(() => { opFailed = true; })
  .then(() => {
    pendingOps--;
    if (pendingOps === 0){
      if (opFailed){ opFailed = false; toast("저장하지 못한 기록이 있습니다. 인터넷 연결 확인 후 ↻를 눌러주세요."); serverItems = null; setSync(false); refresh(true); return; }
      if (serverItems){ items = serverItems; serverItems = null; }
      setSync(true); render();
    } else showSync();
  });
}
function showSync(){
  const w = $("#syncWrap");
  if (pendingOps > 0){ w.classList.add("saving"); $("#sync").textContent = `저장 중 ${pendingOps}건…`; }
}
function setSync(ok){
  $("#syncWrap").classList.remove("saving");
  const t = new Date(), p = n => String(n).padStart(2,"0");
  const where = MODE === "demo" ? "체험 모드" : "구글 시트";
  $("#sync").textContent = ok ? `${where} · ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} 저장됨` : "연결 실패";
}
let loading = false;
async function refresh(force){
  if (loading || (pendingOps > 0 && !force)) return;
  loading = true;
  try{
    const res = await callServer({action:"list"});
    if (pendingOps === 0 && res && res.items){ items = res.items; setSync(true); render(); }
  }catch(e){ setSync(false); }
  loading = false;
}

/* ---------- 체험 모드 (SCRIPT_URL 비어 있을 때: 이 기기에만 저장) ---------- */
function parseQR(text){
  const s = String(text||"").trim().replace(/^</,"").replace(/>$/,"").trim();
  const f = s.split("$").map(x=>x.trim());
  if (f.length < 3) return null;
  const p0 = f[0];
  const model = p0.includes("-") ? p0.slice(p0.indexOf("-")+1) : p0;
  const lot = f[2];
  if (!model || !lot) return null;
  return { raw:s, model, lot, serial:f[3]||"" };
}
function demoApi(req){
  const KEY = "sample-log-demo";
  let list = []; try { list = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){} };
  const out = o => Object.assign({items: list.slice().sort((a,b)=>b.scannedAt-a.scannedAt)}, o);
  const addOne = (raw, rework) => {
    const p = parseQR(raw);
    if (!p) return {ok:false, msg:"코드 형식을 읽지 못했습니다"};
    const last = latestIn(list, p.raw);
    let round = 0;
    if (last){
      if (!rework) return {ok:false, dup:true, id:last.id, canRework:true};
      round = (last.rework||0) + 1;
    }
    const id = round ? p.raw + "#R" + round : p.raw;
    list.push({id, scannedAt:Date.now(), model:p.model, lot:p.lot, serial:p.serial, results:[], raw:p.raw, note:"", rework:round});
    return {ok:true, id};
  };
  const it = list.find(i => i.id === req.id);
  switch (req.action){
    case "list": return out({ok:true});
    case "add": { const r = addOne(req.raw, req.rework); save(); return out(r); }
    case "addMany": { const rs = (req.raws||[]).map(addOne); save(); return out({ok:true, results:rs}); }
    case "mark": {
      if (!it) return out({ok:false, msg:"샘플을 찾지 못했습니다."});
      const s = status(it.results); if (s==="pass"||s==="fail") return out({ok:false, msg:"이미 판정이 끝난 샘플입니다."});
      it.results.push(req.value); save(); return out({ok:true});
    }
    case "undo": if (it){ it.results.pop(); save(); } return out({ok:true});
    case "note": if (it){ it.note = String(req.text||""); save(); } return out({ok:true});
    case "del": list = list.filter(i => i.id !== req.id); save(); return out({ok:true});
    case "closeDay": { const n = list.length; list = []; save(); return out({ok:true, archived:n, sheet:"(체험 모드)"}); }
  }
  return out({ok:false, msg:"알 수 없는 요청"});
}

/* ---------- 상태 ---------- */
function status(r){
  r = r||[];
  if (r.includes("O")) return "pass";
  if (r.length >= MAX_TRIES) return "fail";
  return r.length ? "retest" : "wait";
}
const LABEL = {pass:"PASS", fail:"FAIL", wait:"측정 대기", retest:"재측정"};

/* ---------- 등록 (화면에 바로 추가 → 뒤에서 저장) ---------- */
function stripRaw(t){ return String(t||"").trim().replace(/^</,"").replace(/>$/,"").trim(); }
// 화면에 추가만 하고 결과 반환: {ok, dup, bad, item}
// 같은 코드의 가장 최근 회차(리워크 포함)
function latestIn(list, raw){
  let best = null;
  list.forEach(i => { if (i.raw === raw && (!best || (i.rework||0) > (best.rework||0))) best = i; });
  return best;
}
function addLocal(text, rework){
  const p = parseQR(text);
  if (!p) return {bad:true};
  const last = latestIn(items, p.raw);
  let round = 0;
  if (last){
    if (!rework) return {dup:true, item:last, canRework:true};
    round = (last.rework||0) + 1;
  }
  const id = round ? p.raw + "#R" + round : p.raw;
  const item = {id, scannedAt:Date.now(), model:p.model, lot:p.lot, serial:p.serial, results:[], raw:p.raw, note:"", rework:round, saving:true};
  items.unshift(item);
  return {ok:true, item};
}
function register(text){
  const r = addLocal(text);
  if (r.bad){ toast("코드 형식을 읽지 못했습니다: " + String(text).slice(0,40)); return r; }
  if (r.dup && r.canRework){ askRework(r.item); return r; }
  if (r.dup){ toast(`이미 등록된 샘플입니다 (${r.item.model} / ${r.item.lot})`); flash(r.item.id); return r; }
  toast(`등록: ${r.item.model} / 로트 ${r.item.lot}`);
  flash(r.item.id);
  enqueue({action:"add", raw:text});
  return r;
}
// 리워크 재등록 (FAIL 샘플만)
function doRework(item){
  const r = addLocal(item.raw, true);
  if (!r.ok) return;
  toast(`리워크 ${r.item.rework}회 등록: ${r.item.model} / 로트 ${r.item.lot}`);
  flash(r.item.id);
  enqueue({action:"add", raw:item.raw, rework:true});
}
// FAIL 이력이 있는 샘플을 다시 스캔했을 때 확인 창
let rwTarget = null, rwOpen = false;
function askRework(item){
  rwTarget = item; rwOpen = true;
  const s = status(item.results);
  $("#rwText").innerHTML = `이미 등록된 샘플입니다.<br><b>${esc(item.model)} / 로트 ${esc(item.lot)}</b>${item.rework ? ` (리워크 ${item.rework}회)` : ""} · 현재 <span class="pill ${s}">${LABEL[s]}</span><br><br>재측정(리워크)으로 새로 등록할까요?<br><small style="color:var(--muted)">이전 기록은 그대로 남습니다. 실수로 다시 찍었다면 취소를 누르세요.</small>`;
  $("#rwModal").hidden = false;
}
function closeRework(){ $("#rwModal").hidden = true; rwOpen = false; rwTarget = null; }
$("#rwOk").addEventListener("click", ()=>{ const t = rwTarget; closeRework(); if (t) doRework(t); });
$("#rwCancel").addEventListener("click", closeRework);

/* ---------- 사진에서 코드 읽기 (QR + 데이터 매트릭스) ---------- */
const FORMATS = ["qr_code","data_matrix"];
let nativeDet = null;
async function getNativeDetector(){
  if (nativeDet !== null) return nativeDet || null;
  nativeDet = false;
  if ("BarcodeDetector" in window){
    try{
      const sup = await BarcodeDetector.getSupportedFormats();
      const f = FORMATS.filter(x=>sup.includes(x));
      if (f.length) nativeDet = new BarcodeDetector({formats:f});
    }catch(e){}
  }
  return nativeDet || null;
}
const ZX_OPTS = {formats:["DataMatrix","QRCode"], tryHarder:true, tryRotate:true, tryInvert:true, tryDownscale:true, maxNumberOfSymbols:1};
async function decodeCanvas(c, ctx){
  const d = ctx.getImageData(0,0,c.width,c.height);
  if (window.ZXingWASM){
    try{
      const out = await ZXingWASM.readBarcodes(d, ZX_OPTS);
      const hit = out.find(o=>o.isValid && o.text);
      if (hit) return hit.text;
    }catch(e){}
  }
  if (window.jsQR){
    const r = jsQR(d.data,c.width,c.height,{inversionAttempts:"dontInvert"});
    if (r && r.data) return r.data;
  }
  return null;
}
async function loadBitmap(file){
  if (window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  return await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); });
}
async function decodeImage(file){
  const img = await loadBitmap(file);
  try{
    const det = await getNativeDetector();
    if (det){
      try{ const r = await det.detect(img); if (r[0]) return r[0].rawValue; }catch(e){}
    }
    if (!window.jsQR && !window.ZXingWASM) throw new Error("nojsqr");
    const W = img.width, H = img.height;
    const c = document.createElement("canvas"), ctx = c.getContext("2d",{willReadFrequently:true});
    // 라벨은 보통 가운데 → 가운데부터 시도해서 빨리 끝냄
    for (const [crop, max] of [[0.4,1400],[0.65,1600],[1,1600],[0.25,1200],[1,2400]]){
      const cw = W*crop, ch = H*crop, sx = (W-cw)/2, sy = (H-ch)/2;
      const k = Math.min(1, max/Math.max(cw,ch));
      c.width = Math.round(cw*k); c.height = Math.round(ch*k);
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, c.width, c.height);
      const text = await decodeCanvas(c, ctx);
      if (text) return text;
      await new Promise(res=>setTimeout(res,0));
    }
    return null;
  } finally { if (img.close) img.close(); }
}
function readErr(err){
  return err && err.message==="nojsqr" ? "해독 기능을 불러오지 못했습니다. 인터넷 연결 확인 후 새로고침해주세요." : "사진을 읽지 못했습니다.";
}

$("#cam").addEventListener("change", async e=>{

    register(text);
  }catch(err){ hideProgress(); toast(readErr(err)); }

// 여러 장 선택 → 차례로 읽고 한 번에 저장
let batchRunning = false;
$("#multi").addEventListener("change", async e=>{
  const files = [...(e.target.files||[])]; e.target.value = "";
  if (!files.length || batchRunning) return;
  batchRunning = true;
  const raws = [], failed = [];
  let dup = 0, failDup = 0;
  for (let i = 0; i < files.length; i++){
    showProgress(`사진 ${i+1} / ${files.length} 읽는 중… (등록 ${raws.length}건)`);
    try{
      const text = await decodeImage(files[i]);
      if (!text){ failed.push(i+1); continue; }
      const r = addLocal(text);
      if (r.ok){ raws.push(text); render(); }
      else if (r.dup){ dup++; if (r.canRework) failDup++; }
      else failed.push(i+1);
    }catch(err){ failed.push(i+1); }
  }
  hideProgress();
  batchRunning = false;
  render();
  if (raws.length) enqueue({action:"addMany", raws});
  let msg = `${raws.length}건 등록`;
  if (dup) msg += ` · 이미 등록된 ${dup}건 제외 (재측정은 카드의 '재측정(리워크) 등록' 버튼으로)`;
  if (failed.length) msg += ` · 인식 실패 ${failed.length}장 (${failed.slice(0,8).join(", ")}번째${failed.length>8?" 등":""})`;
  showProgress(msg); setTimeout(hideProgress, 6000);
});
function showProgress(t){ const el = $("#progress"); el.textContent = t; el.hidden = false; }
function hideProgress(){ $("#progress").hidden = true; }

$("#manual").addEventListener("submit", e=>{
  e.preventDefault(); const v = $("#raw").value.trim(); if (!v) return;

});

/* ---------- 실시간 스캔 (외부 호스팅판에서만) ---------- */
let stream = null, scanning = false, detector = null, lastCode = "", lastCodeAt = 0, handling = false;
const canLive = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
if (IS_GAS){
  // 구글 화면 안에서는 카메라가 막혀 있으므로 실시간 스캔판으로 연결
  if (LIVE_URL){ const a = $("#liveLink"); a.href = LIVE_URL; a.hidden = false; }
} else {
  $("#liveBtn").hidden = false;
}
$("#liveBtn").addEventListener("click", startLive);
$("#liveClose").addEventListener("click", stopLive);
async function startLive(){
  if (!canLive){
    toast(/KAKAOTALK|NAVER|Line\//i.test(navigator.userAgent)
      ? "이 앱 안의 브라우저에서는 카메라를 쓸 수 없습니다. ⋮ 메뉴 → 다른 브라우저(크롬)로 열어주세요."
      : "이 브라우저에서는 카메라를 쓸 수 없습니다. 크롬으로 열어주세요.");
    return;
  }
  try{
    stream = await openStream();          // 1) 권한 받기 + 카메라 이름 읽기
  }catch(e){
    toast("카메라를 열 수 없습니다. 브라우저 설정에서 카메라 권한을 허용해주세요."); return;
  }
  backCams = await listBackCams();
  const cur = stream.getVideoTracks()[0].getSettings().deviceId;
  if (backCams.length && backCams[0].deviceId && backCams[0].deviceId !== cur){
    // 2) 메인(자동초점) 카메라로 다시 열기
    stopStream();
    try{ stream = await openStream(backCams[0].deviceId); camIdx = 0; }
    catch(e){ stream = await openStream(); camIdx = Math.max(0, backCams.findIndex(d=>d.deviceId===cur)); }
  } else camIdx = Math.max(0, backCams.findIndex(d=>d.deviceId===cur));
  $("#live").hidden = false; $("#liveLast").textContent = "스캔 대기 중…";
  await attachStream();
  detector = await getNativeDetector();
  scanning = true; loop();
}

/* ----- 카메라 제어: 메인 카메라 · 연속 자동초점 · 줌 · 탭 초점 · 플래시 ----- */
let backCams = [], camIdx = 0, track = null, caps = {}, torchOn = false;
function openStream(deviceId){
  const base = {width:{ideal:1920}, height:{ideal:1080}};
  const video = deviceId ? Object.assign({deviceId:{exact:deviceId}}, base) : Object.assign({facingMode:{ideal:"environment"}}, base);
  return navigator.mediaDevices.getUserMedia({video, audio:false});
}
function stopStream(){ if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
async function listBackCams(){
  try{
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
    const back = devs.filter(d=>/back|rear|environment|후면/i.test(d.label));
    const list = (back.length ? back : devs).slice();
    // 안드로이드는 보통 "camera2 0"이 메인(자동초점) 카메라, 광각·망원은 뒤로
    const score = d => (/camera2? ?0\b/i.test(d.label) ? 10 : 0) - (/ultra|wide|광각|tele|망원/i.test(d.label) ? 5 : 0);
    list.sort((a,b)=>score(b)-score(a));
    return list;
  }catch(e){ return []; }
}
async function attachStream(){
  const v = $("#video"); v.srcObject = stream; await v.play().catch(()=>{});
  track = stream.getVideoTracks()[0];
  caps = (track.getCapabilities && track.getCapabilities()) || {};
  torchOn = false;
  if (caps.focusMode && caps.focusMode.includes("continuous")){
    try{ await track.applyConstraints({advanced:[{focusMode:"continuous"}]}); }catch(e){}
  }
  const zb = $("#zoomBtns"); zb.innerHTML = "";
  if (caps.zoom && caps.zoom.max > 1){
    const levels = [1,2,3,4].filter(z=>z>=caps.zoom.min && z<=caps.zoom.max);
    zb.innerHTML = levels.map(z=>`<button type="button" data-z="${z}">${z}x</button>`).join("");
    await setZoom(Math.min(2, caps.zoom.max));
  }
  $("#torchBtn").hidden = !caps.torch; $("#torchBtn").classList.remove("on");
  $("#switchBtn").hidden = backCams.length < 2;
  const label = (track.label||"카메라").replace(/\(.*?\)/g,"").trim().slice(0,30);
  const af = caps.focusMode ? (caps.focusMode.includes("continuous") ? "자동초점 ✓" : "자동초점 ✗") : "초점정보 없음";
  $("#camInfo").textContent = `${label} · ${af}${caps.zoom ? " · 줌 최대 " + caps.zoom.max + "x" : ""}`;
}
async function setZoom(z){
  try{ await track.applyConstraints({advanced:[{zoom:z}]}); }catch(e){}
  document.querySelectorAll("#zoomBtns button").forEach(b=>b.classList.toggle("on", +b.dataset.z===z));
}
$("#zoomBtns").addEventListener("click", e=>{ const b = e.target.closest("button"); if (b) setZoom(+b.dataset.z); });
$("#torchBtn").addEventListener("click", async ()=>{
  torchOn = !torchOn;
  try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ torchOn = false; }
  $("#torchBtn").classList.toggle("on", torchOn);
});
$("#switchBtn").addEventListener("click", async ()=>{
  if (backCams.length < 2) return;
  camIdx = (camIdx + 1) % backCams.length;
  stopStream();
  try{ stream = await openStream(backCams[camIdx].deviceId); }catch(e){ stream = await openStream(); }
  await attachStream();
});
// 화면을 톡 누르면 그 위치에 초점
$("#video").addEventListener("click", async e=>{
  if (!track) return;
  const r = e.currentTarget.getBoundingClientRect();
  const ring = $("#focusRing"); ring.style.left = e.clientX + "px"; ring.style.top = e.clientY + "px"; ring.hidden = false;
  setTimeout(()=>ring.hidden = true, 900);
  const modes = caps.focusMode || [];
  const point = {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height};
  try{
    const c = {};
    if (caps.pointsOfInterest !== undefined || "pointsOfInterest" in (track.getSettings ? track.getSettings() : {})) c.pointsOfInterest = [point];
    if (modes.includes("single-shot")) c.focusMode = "single-shot";
    else if (modes.includes("continuous")) c.focusMode = "continuous";
    if (Object.keys(c).length) await track.applyConstraints({advanced:[c]});
    if (c.focusMode === "single-shot" && modes.includes("continuous"))
      setTimeout(()=>track && track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{}), 1500);
  }catch(err){}
});
function stopLive(){
  scanning = false;
  stopStream(); track = null;
  $("#live").hidden = true; $("#video").srcObject = null;
  render();
}
const lc = document.createElement("canvas"), lctx = lc.getContext("2d",{willReadFrequently:true});
async function loop(){
  if (!scanning) return;
  const v = $("#video");
  if (!handling && !rwOpen && v.readyState >= 2 && v.videoWidth){
    let text = null;
    try{
      if (detector){ const r = await detector.detect(v); if (r[0]) text = r[0].rawValue; }
      else {
        const s = Math.min(v.videoWidth, v.videoHeight)*0.7, sx = (v.videoWidth-s)/2, sy = (v.videoHeight-s)/2;
        const k = Math.min(1, 900/s);
        lc.width = lc.height = Math.round(s*k);
        lctx.drawImage(v, sx, sy, s, s, 0, 0, lc.width, lc.height);
        text = await decodeCanvas(lc, lctx);
      }
    }catch(e){}
    const now = Date.now();
    if (text && !(text === lastCode && now - lastCodeAt < 4000)){
      lastCode = text; lastCodeAt = now; handling = true;
      $("#frame").classList.add("hit"); if (navigator.vibrate) navigator.vibrate(80);
      const r = register(text);
      $("#liveLast").innerHTML = r.ok ? `✓ 등록: <b>${esc(r.item.model)}</b> / 로트 <b>${esc(r.item.lot)}</b>`
        : r.dup && r.canRework ? `이미 등록됨: <b>${esc(r.item.model)}</b> / <b>${esc(r.item.lot)}</b> — 재측정 여부 선택`
        : r.dup ? `이미 등록됨: <b>${esc(r.item.model)}</b> / <b>${esc(r.item.lot)}</b>` : "코드 형식이 다릅니다";
      setTimeout(()=>{ $("#frame").classList.remove("hit"); handling = false; }, 700);
    }
  }
  setTimeout(()=>requestAnimationFrame(loop), 100);
}

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(t){ const d = new Date(t), p = n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

let renderPending = false;
function render(force){
  // 비고를 입력하는 중에는 목록을 다시 그리지 않음 (입력 끊김 방지)
  const ae = document.activeElement;
  if (!force && ae && ae.classList && ae.classList.contains("noteInput")){ renderPending = true; updateCounts(); return; }
  renderPending = false;
  updateCounts();
  const shown = items.filter(i=>{
    const s = status(i.results);
    if (filter==="todo" && !(s==="wait"||s==="retest")) return false;
    if (filter==="pass" && s!=="pass") return false;
    if (filter==="fail" && s!=="fail") return false;
    if (query && !(`${i.model} ${i.lot} ${i.serial} ${i.note||""}`.toLowerCase().includes(query))) return false;
    return true;
  });
  const list = $("#list");
  window.__shown = shown;
  if (!items.length){ list.innerHTML = `<div class="empty">아직 등록된 샘플이 없습니다.<br>위의 버튼으로 첫 샘플을 등록하세요.</div>`; return; }
  if (!shown.length){ list.innerHTML = `<div class="empty">조건에 맞는 샘플이 없습니다.</div>`; return; }
  list.innerHTML = shown.map((i, idx)=>{
    const r = i.results||[], s = status(r), done = s==="pass"||s==="fail";
    const slots = [0,1,2].map(n=>{
      const v = r[n];
      if (v) return `<div class="slot ${v}"><small>${n+1}차</small><span class="mark">${v}</span></div>`;
      if (!done && n===r.length) return `<div class="slot active"><small>${n+1}차 측정</small>
        <div class="oxs"><button class="ox o" data-a="O" data-i="${idx}" aria-label="${n+1}차 O 합격">O</button>
        <button class="ox x" data-a="X" data-i="${idx}" aria-label="${n+1}차 X 불합격">X</button></div></div>`;
      return `<div class="slot off"><small>${n+1}차</small><span class="mark">–</span></div>`;
    }).join("");
    return `<article class="card ${s}${i.id===flashId?" flash":""}" data-id="${esc(i.id)}">
      <div class="head"><div class="ids">
        <div class="field"><span>형번</span><b>${esc(i.model)}</b></div>
        <div class="field"><span>로트</span><b>${esc(i.lot)}</b></div></div>
        <span class="pill ${s}">${LABEL[s]}</span></div>
      <div class="meta">${esc(i.serial)}${i.serial?" · ":""}입고 ${fmt(i.scannedAt)}${i.rework?`<span class="rw">리워크 ${i.rework}회</span>`:""}${i.saving?' · <span class="saving">저장 중…</span>':""}</div>
      <div class="slots">${slots}</div>
      <div class="note"><label for="note-${idx}">비고</label>
        <textarea class="noteInput" id="note-${idx}" data-i="${idx}" rows="1" placeholder="특이사항 입력">${esc(i.note||"")}</textarea></div>
      <div class="actions">
        ${latestIn(items, i.raw)===i ? `<button class="link rework" data-a="rework" data-i="${idx}">↻ 재측정(리워크) 등록</button>`:""}
        ${r.length?`<button class="link" data-a="undo" data-i="${idx}">마지막 기록 취소</button>`:""}
        <button class="link danger" data-a="del" data-i="${idx}">삭제</button></div></article>`;
  }).join("");
  flashId = null;
}
// 형번별 종합: 같은 샘플(코드)은 가장 최근 회차만 셈
function summarize(list){
  const latest = new Map();
  list.forEach(i=>{ const l = latest.get(i.raw); if (!l || (i.rework||0) > (l.rework||0)) latest.set(i.raw, i); });
  const by = new Map();
  latest.forEach(i=>{
    const m = by.get(i.model) || {model:i.model, received:0, pass:0, fail:0, wait:0, rework:0};
    const s = status(i.results);
    m.received++;
    if (s==="pass") m.pass++; else if (s==="fail") m.fail++; else m.wait++;
    if (i.rework) m.rework++;
    by.set(i.model, m);
  });
  const rows = [...by.values()].sort((a,b)=>a.model.localeCompare(b.model));
  const total = rows.reduce((t,r)=>({model:"합계", received:t.received+r.received, pass:t.pass+r.pass, fail:t.fail+r.fail, wait:t.wait+r.wait, rework:t.rework+r.rework}),
    {model:"합계", received:0, pass:0, fail:0, wait:0, rework:0});
  return {rows, total};
}
function passRate(r){ const d = r.pass + r.fail; return d ? Math.round(r.pass / d * 1000) / 10 + "%" : "-"; }
function updateCounts(){
  const {rows, total} = summarize(items);
  $("#c-all").textContent = total.received;
  $("#c-todo").textContent = total.wait;
  $("#c-pass").textContent = total.pass;
  $("#c-fail").textContent = total.fail;
  const n = (v, cls) => `<td class="${v ? cls : "zero"}">${v}</td>`;
  $("#sumTable").innerHTML = rows.length
    ? `<thead><tr><th>형번</th><th>수령</th><th>PASS</th><th>FAIL</th><th>측정중</th><th>리워크</th><th>합격률</th></tr></thead><tbody>` +
      [...rows, total].map(r=>`<tr class="${r===total?"total":""}"><td>${esc(r.model)}</td><td>${r.received}</td>${n(r.pass,"p")}${n(r.fail,"f")}${n(r.wait,"w")}<td>${r.rework}</td><td>${passRate(r)}</td></tr>`).join("") + `</tbody>`
    : `<tbody><tr><td style="color:var(--muted);font-family:var(--font-body)">아직 등록된 샘플이 없습니다.</td></tr></tbody>`;
}
function flash(id){
  flashId = id; render(true);
  const el = [...document.querySelectorAll(".card")].find(c=>c.dataset.id===id);
  if (el && $("#live").hidden) el.scrollIntoView({behavior:"smooth", block:"center"});
}

// 비고 저장: 입력칸에서 벗어나면 저장
$("#list").addEventListener("focusout", e=>{
  const t = e.target; if (!t.classList || !t.classList.contains("noteInput")) return;
  const item = (window.__shown||[])[+t.dataset.i]; if (!item) return;
  const v = t.value.trim();
  if (v !== (item.note||"")){
    item.note = v;
    enqueue({action:"note", id:item.id, text:v});
    toast("비고 저장");
  }
  setTimeout(()=>{ if (renderPending) render(); }, 0);
});

let pendingDel = null, delTimer = null;
$("#list").addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if (!b) return;
  const item = (window.__shown||[])[+b.dataset.i]; if (!item) return;
  const a = b.dataset.a;
  if (a==="del" && pendingDel!==item.id){
    pendingDel = item.id; b.textContent = "한 번 더 누르면 삭제";
    clearTimeout(delTimer); delTimer = setTimeout(()=>{ pendingDel = null; render(); }, 3000);
    return;
  }
  clearTimeout(delTimer); pendingDel = null;
  if (a==="rework"){ doRework(item); return; }
  const r = item.results = [...(item.results||[])];
  if (a==="O"||a==="X"){
    const s0 = status(r); if (s0==="pass"||s0==="fail") return;
    r.push(a);
    enqueue({action:"mark", id:item.id, value:a});
    const s = status(r);
    if (s==="retest") toast(`${item.model} / ${item.lot}: ${r.length}차 X → ${r.length+1}차 재측정`);
    if (s==="fail") toast(`${item.model} / ${item.lot}: 3회 모두 X → 최종 FAIL`);
  } else if (a==="undo"){
    if (!r.length) return;
    r.pop(); enqueue({action:"undo", id:item.id});
  } else if (a==="del"){
    items = items.filter(i=>i!==item);
    enqueue({action:"del", id:item.id}); toast("삭제했습니다.");
  }
  render(true);
});

/* ---------- 데이터 내보내기 (CSV: 엑셀·구글시트·휴대폰 모두 열림) ---------- */
// list: 내보낼 기록, tag: 파일 이름에 붙일 말(예: "마감"). 성공하면 true
function exportFile(list, tag){
  if (!list.length){ toast("내보낼 기록이 없습니다."); return false; }
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const p = n => String(n).padStart(2,"0");
  const dt = t => { const d = new Date(t); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const rows = [["입고시간","형번","로트","시리얼","리워크","1차","2차","3차","판정","비고"]];
  [...list].sort((a,b)=>a.scannedAt-b.scannedAt).forEach(i=>{
    const r = i.results||[];
    rows.push([dt(i.scannedAt), i.model, i.lot, i.serial, i.rework||0, r[0]||"", r[1]||"", r[2]||"", LABEL[status(r)], i.note||""]);
  });
  const now = new Date();
  const base = `샘플시험기록_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}${tag ? "_" + tag : ""}`;
  // 1순위: 진짜 엑셀(.xlsx) 파일 — 권한 필요 없음. 첫 시트 "종합", 둘째 시트 "기록"
  if (window.XLSX){
    try{
      const {rows: sr, total} = summarize(list);
      const times = list.map(i=>i.scannedAt).sort((a,b)=>a-b);
      const sum = [
        ["샘플 입고 시험 종합"],
        ["입고 기간", `${dt(times[0])} ~ ${dt(times[times.length-1])}`],
        ["작성 시각", dt(now.getTime())],
        ["기준", "같은 샘플은 가장 최근 회차(리워크 포함) 결과로 1개만 셈"],
        [],
        ["형번","수령","PASS","FAIL","측정중","리워크","합격률"],
        ...[...sr, total].map(r=>[r.model, r.received, r.pass, r.fail, r.wait, r.rework, passRate(r)])
      ];
      const ws1 = XLSX.utils.aoa_to_sheet(sum);
      ws1["!cols"] = [{wch:14},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:9}];
      ws1["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:6}}, {s:{r:3,c:1}, e:{r:3,c:6}}];
      const ws2 = XLSX.utils.aoa_to_sheet(rows);
      ws2["!cols"] = [{wch:17},{wch:11},{wch:15},{wch:13},{wch:7},{wch:5},{wch:5},{wch:5},{wch:9},{wch:30}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws1, "종합");
      XLSX.utils.book_append_sheet(wb, ws2, "기록");
      XLSX.writeFile(wb, base + ".xlsx");
      toast(`${list.length}건 내보냄 (${base}.xlsx)`);
      return true;
    }catch(e){}
  }
  // 2순위: CSV (형번·로트가 숫자/날짜로 바뀌지 않도록 ="..." 형태)
  const csv = "﻿" + rows.map((r,ri)=>r.map((v,ci)=> ri>0 && (ci===1||ci===2) ? `="${String(v).replace(/"/g,'""')}"` : q(v)).join(",")).join("\r\n");
  const name = base + ".csv";
  try{
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast(`${list.length}건 내보냄 (${name})`);
    return true;
  }catch(e){ toast("파일을 만들지 못했습니다."); return false; }
}
$("#exportBtn").addEventListener("click", ()=>{
  exportFile((window.__shown && window.__shown.length) ? window.__shown : items, "");
});

/* ---------- 하루 마감: 엑셀 저장 → 구글 시트 "보관_날짜" 시트로 옮기고 목록 비우기 ---------- */
$("#closeBtn").addEventListener("click", ()=>{
  if (!items.length){ toast("마감할 기록이 없습니다."); return; }
  const {total} = summarize(items);
  $("#closeText").innerHTML = `<b>하루 마감</b><br><br>
    샘플 <b>${total.received}개</b> (기록 ${items.length}건) · PASS ${total.pass} · FAIL ${total.fail} · 측정중 ${total.wait}<br><br>
    1) 전체 기록을 엑셀 파일로 저장하고<br>2) 목록을 비웁니다.<br><br>
    <small style="color:var(--muted)">비운 기록은 구글 시트의 '보관_날짜' 시트에 남습니다. 같은 링크를 쓰는 다른 사람의 목록도 함께 비워집니다.</small>
    ${total.wait ? `<br><br><b style="color:var(--wait)">⚠ 아직 측정이 끝나지 않은 샘플이 ${total.wait}개 있습니다.</b>` : ""}`;
  $("#closeModal").hidden = false;
});
$("#closeCancel").addEventListener("click", ()=>{ $("#closeModal").hidden = true; });
$("#closeOk").addEventListener("click", async ()=>{
  $("#closeModal").hidden = true;
  showProgress("저장 중인 기록을 마무리하는 중…");
  await chain;                                   // 저장 대기 중인 기록 먼저 처리
  const snapshot = items.slice();
  const saved = exportFile(snapshot, "마감");
  if (!saved){ hideProgress(); toast("엑셀 파일을 만들지 못해 마감을 취소했습니다."); return; }
  showProgress("목록 비우는 중…");
  enqueue({action:"closeDay"}, res=>{
    hideProgress();
    if (res && res.ok) toast(`마감 완료: ${res.archived}건을 '${res.sheet}' 시트에 보관했습니다.`);
  });
  items = []; render(true);
});
// 구글 시트 / xlsx 링크 (시트 주인 계정으로 로그인되어 있어야 열림)
async function loadLinks(){
  if (MODE === "demo") return;
  try{
    const r = await callServer({action:"info"});
    if (r && r.ok && r.sheetUrl){
      $("#sheetLink").href = r.sheetUrl;
      $("#exportLinks").hidden = false;
    }
  }catch(e){}
}

let tt = null;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(()=>el.hidden = true, 2600); }

if (MODE === "demo"){
  const b = $("#banner"); b.hidden = false;
  b.textContent = "체험 모드: 아직 구글 시트와 연결되지 않아 이 기기에만 저장됩니다. (SCRIPT_URL 설정 필요)";
}
// 다른 사람 기록 받아오기: 20초마다 (저장 중·입력 중엔 건너뜀)
setInterval(()=>{ if (!document.hidden && $("#live").hidden && !batchRunning) refresh(); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(); });

// 해독 기능 상태 표시
(async function diag(){
  const parts = [];
  const det = await getNativeDetector();
  let sup = [];
  if ("BarcodeDetector" in window){ try{ sup = await BarcodeDetector.getSupportedFormats(); }catch(e){} }
  parts.push("내장 " + (det ? "✓" : "✗") + (sup.length ? "(" + (sup.includes("data_matrix") ? "DM" : "noDM") + ")" : ""));
  let zx = "✗";
  if (window.ZXingWASM){
    try{
      const c = document.createElement("canvas"); c.width = c.height = 8;
      await ZXingWASM.readBarcodes(c.getContext("2d").getImageData(0,0,8,8), ZX_OPTS);
      zx = "✓";
    }catch(e){ zx = "✗(" + String(e && e.message || e).slice(0,40) + ")"; }
  } else zx = "✗(미로드)";
  parts.push("zxing " + zx);
  parts.push("jsQR " + (window.jsQR ? "✓" : "✗"));
  $("#diag").textContent = "v10 · " + parts.join(" · ");
})();
window.__test = {parseQR, status, demoApi};
refresh(true);
loadLinks();
})();
