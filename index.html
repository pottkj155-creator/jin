<style>
:root{
  --bg:#f3f5f3; --surface:#ffffff; --fg:#18201d; --muted:#5c6964; --line:#d9e0dc;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync.saving{color:var(--wait)}
.sync button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.count{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font:inherit;color:inherit;text-align:left;cursor:pointer}
.count b{display:block;font-family:var(--font-mono);font-size:18px;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
.count[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count.pass b{color:var(--pass)} .count.fail b{color:var(--fail)} .count.wait b{color:var(--wait)}

.scan{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer;min-height:44px}
.btn:focus-visible,.count:focus-visible,.ox:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:17px;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.secondary{display:flex;align-items:center;justify-content:center;gap:8px;border-color:var(--accent);color:var(--accent)}

.banner{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:8px;background:var(--wait-soft);color:var(--wait)}

.live{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}
.live video{flex:1;width:100%;min-height:0;object-fit:cover}
.live .frame{position:absolute;left:50%;top:42%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none;transition:border-color .2s}

.live .bar{position:absolute;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.8))}

.live .close{background:#fff;color:#111;border:none;font:inherit;font-weight:700;font-size:17px;border-radius:12px;min-height:52px;cursor:pointer}
.live .top-hint{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
</style>

<body>
<header><div class="wrap">
  <div class="top"><h1>샘플 입고 시험기록</h1><span class="sync" id="syncWrap"><span id="sync">연결 중…</span><button id="refresh" type="button" aria-label="새로고침">↻</button></span></div>
  <div class="counts" id="counts">

    <p class="hint">기본 카메라로 라벨을 쭉 찍은 뒤 <b>사진 여러 장 선택</b>으로 한 번에 등록하면 빠릅니다. 사진은 서버에 올라가지 않고 휴대폰 안에서만 읽습니다.</p>

  <div class="tools">

<div class="toast" id="toast" hidden></div>

<script>
(function(){
const MAX_TRIES = 3;
const $ = s => document.querySelector(s);
const IS_GAS = typeof google !== "undefined" && google.script && google.script.run;
const MODE = IS_GAS ? "gas" : (SCRIPT_URL ? "remote" : "demo");
let items = [], filter = "all", query = "", flashId = null;

/* ---------- 서버 호출 ---------- */
function callServer(req){
  if (MODE === "gas") return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
  if (MODE === "remote") return fetch(SCRIPT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(req)})
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  return new Promise(r => setTimeout(() => r(demoApi(req)), 300));
}

/* 저장은 순서대로 뒤에서 처리하고, 화면은 바로 바꿈 (대기시간 없음) */
let chain = Promise.resolve(), pendingOps = 0, serverItems = null, opFailed = false;
function enqueue(req, onDone){
  pendingOps++; showSync();
  chain = chain.then(() => callServer(req)).then(res => {
    if (res && res.items) serverItems = res.items;
    if (res && !res.ok && res.msg && !res.dup) toast(res.msg);
    if (onDone) onDone(res);
  }).catch(() => { opFailed = true; })
  .then(() => {
    pendingOps--;
    if (pendingOps === 0){
      if (opFailed){ opFailed = false; toast("저장하지 못한 기록이 있습니다. 인터넷 연결 확인 후 ↻를 눌러주세요."); serverItems = null; setSync(false); refresh(true); return; }
      if (serverItems){ items = serverItems; serverItems = null; }
      setSync(true); render();
    } else showSync();
  });
}
function showSync(){
  const w = $("#syncWrap");
  if (pendingOps > 0){ w.classList.add("saving"); $("#sync").textContent = `저장 중 ${pendingOps}건…`; }
}
function setSync(ok){
  $("#syncWrap").classList.remove("saving");
  const t = new Date(), p = n => String(n).padStart(2,"0");
  const where = MODE === "demo" ? "체험 모드" : "구글 시트";
  $("#sync").textContent = ok ? `${where} · ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())} 저장됨` : "연결 실패";
}
let loading = false;
async function refresh(force){
  if (loading || (pendingOps > 0 && !force)) return;
  loading = true;
  try{
    const res = await callServer({action:"list"});
    if (pendingOps === 0 && res && res.items){ items = res.items; setSync(true); render(); }
  }catch(e){ setSync(false); }
  loading = false;
}

/* ---------- 체험 모드 (SCRIPT_URL 비어 있을 때: 이 기기에만 저장) ---------- */
function parseQR(text){
  const s = String(text||"").trim().replace(/^</,"").replace(/>$/,"").trim();
  const f = s.split("$").map(x=>x.trim());
  if (f.length < 3) return null;
  const p0 = f[0];
  const model = p0.includes("-") ? p0.slice(p0.indexOf("-")+1) : p0;
  const lot = f[2].replace(/\D/g,"").slice(-3);
  if (!model || lot.length < 3) return null;
  return { raw:s, model, lot, serial:f[3]||"" };
}
function demoApi(req){
  const KEY = "sample-log-demo";
  let list = []; try { list = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){} };
  const out = o => Object.assign({items: list.slice().sort((a,b)=>b.scannedAt-a.scannedAt)}, o);
  const addOne = raw => {
    const p = parseQR(raw);
    if (!p) return {ok:false, msg:"코드 형식을 읽지 못했습니다"};
    if (list.some(i => i.id === p.raw)) return {ok:false, dup:true, id:p.raw};
    list.push({id:p.raw, scannedAt:Date.now(), model:p.model, lot:p.lot, serial:p.serial, results:[], raw:p.raw, note:""});
    return {ok:true, id:p.raw};
  };
  const it = list.find(i => i.id === req.id);
  switch (req.action){
    case "list": return out({ok:true});
    case "add": { const r = addOne(req.raw); save(); return out(r); }
    case "addMany": { const rs = (req.raws||[]).map(addOne); save(); return out({ok:true, results:rs}); }
    case "mark": {
      if (!it) return out({ok:false, msg:"샘플을 찾지 못했습니다."});
      const s = status(it.results); if (s==="pass"||s==="fail") return out({ok:false, msg:"이미 판정이 끝난 샘플입니다."});
      it.results.push(req.value); save(); return out({ok:true});
    }
    case "undo": if (it){ it.results.pop(); save(); } return out({ok:true});
    case "note": if (it){ it.note = String(req.text||""); save(); } return out({ok:true});
    case "del": list = list.filter(i => i.id !== req.id); save(); return out({ok:true});
  }
  return out({ok:false, msg:"알 수 없는 요청"});
}

/* ---------- 상태 ---------- */
function status(r){
  r = r||[];
  if (r.includes("O")) return "pass";
  if (r.length >= MAX_TRIES) return "fail";
  return r.length ? "retest" : "wait";
}
const LABEL = {pass:"PASS", fail:"FAIL", wait:"측정 대기", retest:"재측정"};

/* ---------- 등록 (화면에 바로 추가 → 뒤에서 저장) ---------- */
function stripRaw(t){ return String(t||"").trim().replace(/^</,"").replace(/>$/,"").trim(); }
// 화면에 추가만 하고 결과 반환: {ok, dup, bad, item}
function addLocal(text){
  const p = parseQR(text);
  if (!p) return {bad:true};
  const dup = items.find(i => i.raw === p.raw || i.id === p.raw);
  if (dup) return {dup:true, item:dup};
  const item = {id:p.raw, scannedAt:Date.now(), model:p.model, lot:p.lot, serial:p.serial, results:[], raw:p.raw, note:"", saving:true};
  items.unshift(item);
  return {ok:true, item};
}
function register(text){
  const r = addLocal(text);
  if (r.bad){ toast("코드 형식을 읽지 못했습니다: " + String(text).slice(0,40)); return r; }
  if (r.dup){ toast(`이미 등록된 샘플입니다 (${r.item.model} / ${r.item.lot})`); flash(r.item.id); return r; }
  toast(`등록: ${r.item.model} / 로트 ${r.item.lot}`);
  flash(r.item.id);
  enqueue({action:"add", raw:text});
  return r;
}

/* ---------- 사진에서 코드 읽기 (QR + 데이터 매트릭스) ---------- */
const FORMATS = ["qr_code","data_matrix"];
let nativeDet = null;
async function getNativeDetector(){
  if (nativeDet !== null) return nativeDet || null;
  nativeDet = false;
  if ("BarcodeDetector" in window){
    try{
      const sup = await BarcodeDetector.getSupportedFormats();
      const f = FORMATS.filter(x=>sup.includes(x));
      if (f.length) nativeDet = new BarcodeDetector({formats:f});
    }catch(e){}
  }
  return nativeDet || null;
}
const ZX_OPTS = {formats:["DataMatrix","QRCode"], tryHarder:true, tryRotate:true, tryInvert:true, tryDownscale:true, maxNumberOfSymbols:1};
async function decodeCanvas(c, ctx){
  const d = ctx.getImageData(0,0,c.width,c.height);
  if (window.ZXingWASM){
    try{
      const out = await ZXingWASM.readBarcodes(d, ZX_OPTS);
      const hit = out.find(o=>o.isValid && o.text);
      if (hit) return hit.text;
    }catch(e){}
  }
  if (window.jsQR){
    const r = jsQR(d.data,c.width,c.height,{inversionAttempts:"dontInvert"});
    if (r && r.data) return r.data;
  }
  return null;
}
async function loadBitmap(file){
  if (window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  return await new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=URL.createObjectURL(file); });
}
async function decodeImage(file){
  const img = await loadBitmap(file);
  try{
    const det = await getNativeDetector();
    if (det){
      try{ const r = await det.detect(img); if (r[0]) return r[0].rawValue; }catch(e){}
    }
    if (!window.jsQR && !window.ZXingWASM) throw new Error("nojsqr");
    const W = img.width, H = img.height;
    const c = document.createElement("canvas"), ctx = c.getContext("2d",{willReadFrequently:true});
    // 라벨은 보통 가운데 → 가운데부터 시도해서 빨리 끝냄
    for (const [crop, max] of [[0.4,1400],[0.65,1600],[1,1600],[0.25,1200],[1,2400]]){
      const cw = W*crop, ch = H*crop, sx = (W-cw)/2, sy = (H-ch)/2;
      const k = Math.min(1, max/Math.max(cw,ch));
      c.width = Math.round(cw*k); c.height = Math.round(ch*k);
      ctx.drawImage(img, sx, sy, cw, ch, 0, 0, c.width, c.height);
      const text = await decodeCanvas(c, ctx);
      if (text) return text;
      await new Promise(res=>setTimeout(res,0));
    }
    return null;
  } finally { if (img.close) img.close(); }
}
function readErr(err){
  return err && err.message==="nojsqr" ? "해독 기능을 불러오지 못했습니다. 인터넷 연결 확인 후 새로고침해주세요." : "사진을 읽지 못했습니다.";
}

// 1장 촬영
$("#cam").addEventListener("change", async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  showProgress("코드 읽는 중…");
  try{
    const text = await decodeImage(f);
    hideProgress();
    if (!text){ toast("코드를 찾지 못했습니다. 라벨의 네모 코드가 화면 가운데에 오도록, 흔들림 없이 찍어주세요."); return; }
    register(text);
  }catch(err){ hideProgress(); toast(readErr(err)); }
});

// 여러 장 선택 → 차례로 읽고 한 번에 저장
let batchRunning = false;
$("#multi").addEventListener("change", async e=>{
  const files = [...(e.target.files||[])]; e.target.value = "";
  if (!files.length || batchRunning) return;
  batchRunning = true;
  const raws = [], failed = [];
  let dup = 0;
  for (let i = 0; i < files.length; i++){
    showProgress(`사진 ${i+1} / ${files.length} 읽는 중… (등록 ${raws.length}건)`);
    try{
      const text = await decodeImage(files[i]);
      if (!text){ failed.push(i+1); continue; }
      const r = addLocal(text);
      if (r.ok){ raws.push(text); render(); }
      else if (r.dup) dup++;
      else failed.push(i+1);
    }catch(err){ failed.push(i+1); }
  }
  hideProgress();
  batchRunning = false;
  render();
  if (raws.length) enqueue({action:"addMany", raws});
  let msg = `${raws.length}건 등록`;
  if (dup) msg += ` · 중복 ${dup}건 제외`;
  if (failed.length) msg += ` · 인식 실패 ${failed.length}장 (${failed.slice(0,8).join(", ")}번째${failed.length>8?" 등":""})`;
  showProgress(msg); setTimeout(hideProgress, 6000);
});
function showProgress(t){ const el = $("#progress"); el.textContent = t; el.hidden = false; }
function hideProgress(){ $("#progress").hidden = true; }

$("#manual").addEventListener("submit", e=>{
  e.preventDefault(); const v = $("#raw").value.trim(); if (!v) return;
  register(v); $("#raw").value = "";
});

/* ---------- 실시간 스캔 (외부 호스팅판에서만) ---------- */
let stream = null, scanning = false, detector = null, lastCode = "", lastCodeAt = 0, handling = false;
const canLive = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
if (IS_GAS){
  // 구글 화면 안에서는 카메라가 막혀 있으므로 실시간 스캔판으로 연결
  if (LIVE_URL){ const a = $("#liveLink"); a.href = LIVE_URL; a.hidden = false; }
} else {
  $("#liveBtn").hidden = false;
}
$("#liveBtn").addEventListener("click", startLive);
$("#liveClose").addEventListener("click", stopLive);
async function startLive(){
  if (!canLive){
    toast(/KAKAOTALK|NAVER|Line\//i.test(navigator.userAgent)
      ? "이 앱 안의 브라우저에서는 카메라를 쓸 수 없습니다. ⋮ 메뉴 → 다른 브라우저(크롬)로 열어주세요."
      : "이 브라우저에서는 카메라를 쓸 수 없습니다. 크롬으로 열어주세요.");
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}, audio:false});
  }catch(e){
    toast("카메라를 열 수 없습니다. 브라우저 설정에서 카메라 권한을 허용해주세요."); return;
  }
  const v = $("#video"); v.srcObject = stream; await v.play().catch(()=>{});
  $("#live").hidden = false; $("#liveLast").textContent = "스캔 대기 중…";
  detector = await getNativeDetector();
  scanning = true; loop();
}
function stopLive(){
  scanning = false;
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
  $("#live").hidden = true; $("#video").srcObject = null;
  render();
}
const lc = document.createElement("canvas"), lctx = lc.getContext("2d",{willReadFrequently:true});
async function loop(){
  if (!scanning) return;
  const v = $("#video");
  if (!handling && v.readyState >= 2 && v.videoWidth){
    let text = null;
    try{
      if (detector){ const r = await detector.detect(v); if (r[0]) text = r[0].rawValue; }
      else {
        const s = Math.min(v.videoWidth, v.videoHeight)*0.7, sx = (v.videoWidth-s)/2, sy = (v.videoHeight-s)/2;
        const k = Math.min(1, 900/s);
        lc.width = lc.height = Math.round(s*k);
        lctx.drawImage(v, sx, sy, s, s, 0, 0, lc.width, lc.height);
        text = await decodeCanvas(lc, lctx);
      }
    }catch(e){}
    const now = Date.now();
    if (text && !(text === lastCode && now - lastCodeAt < 4000)){
      lastCode = text; lastCodeAt = now; handling = true;
      $("#frame").classList.add("hit"); if (navigator.vibrate) navigator.vibrate(80);
      const r = register(text);
      $("#liveLast").innerHTML = r.ok ? `✓ 등록: <b>${esc(r.item.model)}</b> / 로트 <b>${esc(r.item.lot)}</b>`
        : r.dup ? `이미 등록됨: <b>${esc(r.item.model)}</b> / <b>${esc(r.item.lot)}</b>` : "코드 형식이 다릅니다";
      setTimeout(()=>{ $("#frame").classList.remove("hit"); handling = false; }, 700);
    }
  }
  setTimeout(()=>requestAnimationFrame(loop), 100);
}

/* ---------- 목록 ---------- */
$("#counts").addEventListener("click", e=>{
  const b = e.target.closest(".count"); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll(".count").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render(true);
});
$("#q").addEventListener("input", e=>{ query = e.target.value.trim().toLowerCase(); render(true); });
$("#refresh").addEventListener("click", ()=>refresh());

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(t){ const d = new Date(t), p = n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }

let renderPending = false;
function render(force){
  // 비고를 입력하는 중에는 목록을 다시 그리지 않음 (입력 끊김 방지)
  const ae = document.activeElement;
  if (!force && ae && ae.classList && ae.classList.contains("noteInput")){ renderPending = true; updateCounts(); return; }
  renderPending = false;
  updateCounts();
  const shown = items.filter(i=>{
    const s = status(i.results);
    if (filter==="todo" && !(s==="wait"||s==="retest")) return false;
    if (filter==="pass" && s!=="pass") return false;
    if (filter==="fail" && s!=="fail") return false;
    if (query && !(`${i.model} ${i.lot} ${i.serial} ${i.note||""}`.toLowerCase().includes(query))) return false;
    return true;
  });
  const list = $("#list");
  window.__shown = shown;
  if (!items.length){ list.innerHTML = `<div class="empty">아직 등록된 샘플이 없습니다.<br>위의 버튼으로 첫 샘플을 등록하세요.</div>`; return; }
  if (!shown.length){ list.innerHTML = `<div class="empty">조건에 맞는 샘플이 없습니다.</div>`; return; }
  list.innerHTML = shown.map((i, idx)=>{
    const r = i.results||[], s = status(r), done = s==="pass"||s==="fail";
    const slots = [0,1,2].map(n=>{
      const v = r[n];
      if (v) return `<div class="slot ${v}"><small>${n+1}차</small><span class="mark">${v}</span></div>`;
      if (!done && n===r.length) return `<div class="slot active"><small>${n+1}차 측정</small>
        <div class="oxs"><button class="ox o" data-a="O" data-i="${idx}" aria-label="${n+1}차 O 합격">O</button>
        <button class="ox x" data-a="X" data-i="${idx}" aria-label="${n+1}차 X 불합격">X</button></div></div>`;
      return `<div class="slot off"><small>${n+1}차</small><span class="mark">–</span></div>`;
    }).join("");
    return `<article class="card ${s}${i.id===flashId?" flash":""}" data-id="${esc(i.id)}">
      <div class="head"><div class="ids">
        <div class="field"><span>형번</span><b>${esc(i.model)}</b></div>
        <div class="field"><span>로트</span><b>${esc(i.lot)}</b></div></div>
        <span class="pill ${s}">${LABEL[s]}</span></div>
      <div class="meta">${esc(i.serial)}${i.serial?" · ":""}입고 ${fmt(i.scannedAt)}${i.saving?' · <span class="saving">저장 중…</span>':""}</div>
      <div class="slots">${slots}</div>
      <div class="note"><label for="note-${idx}">비고</label>
        <textarea class="noteInput" id="note-${idx}" data-i="${idx}" rows="1" placeholder="특이사항 입력">${esc(i.note||"")}</textarea></div>
      <div class="actions">
        ${r.length?`<button class="link" data-a="undo" data-i="${idx}">마지막 기록 취소</button>`:""}
        <button class="link danger" data-a="del" data-i="${idx}">삭제</button></div></article>`;
  }).join("");
  flashId = null;
}
function updateCounts(){
  const st = items.map(i=>status(i.results));
  $("#c-all").textContent = items.length;
  $("#c-todo").textContent = st.filter(s=>s==="wait"||s==="retest").length;
  $("#c-pass").textContent = st.filter(s=>s==="pass").length;
  $("#c-fail").textContent = st.filter(s=>s==="fail").length;
}
function flash(id){
  flashId = id; render(true);
  const el = [...document.querySelectorAll(".card")].find(c=>c.dataset.id===id);
  if (el && $("#live").hidden) el.scrollIntoView({behavior:"smooth", block:"center"});
}

// 비고 저장: 입력칸에서 벗어나면 저장
$("#list").addEventListener("focusout", e=>{
  const t = e.target; if (!t.classList || !t.classList.contains("noteInput")) return;
  const item = (window.__shown||[])[+t.dataset.i]; if (!item) return;
  const v = t.value.trim();
  if (v !== (item.note||"")){
    item.note = v;
    enqueue({action:"note", id:item.id, text:v});
    toast("비고 저장");
  }
  setTimeout(()=>{ if (renderPending) render(); }, 0);
});

let pendingDel = null, delTimer = null;
$("#list").addEventListener("click", e=>{
  const b = e.target.closest("[data-a]"); if (!b) return;
  const item = (window.__shown||[])[+b.dataset.i]; if (!item) return;
  const a = b.dataset.a;
  if (a==="del" && pendingDel!==item.id){
    pendingDel = item.id; b.textContent = "한 번 더 누르면 삭제";
    clearTimeout(delTimer); delTimer = setTimeout(()=>{ pendingDel = null; render(); }, 3000);
    return;
  }
  clearTimeout(delTimer); pendingDel = null;
  const r = item.results = [...(item.results||[])];
  if (a==="O"||a==="X"){
    const s0 = status(r); if (s0==="pass"||s0==="fail") return;
    r.push(a);
    enqueue({action:"mark", id:item.id, value:a});
    const s = status(r);
    if (s==="retest") toast(`${item.model} / ${item.lot}: ${r.length}차 X → ${r.length+1}차 재측정`);
    if (s==="fail") toast(`${item.model} / ${item.lot}: 3회 모두 X → 최종 FAIL`);
  } else if (a==="undo"){
    if (!r.length) return;
    r.pop(); enqueue({action:"undo", id:item.id});
  } else if (a==="del"){
    items = items.filter(i=>i!==item);
    enqueue({action:"del", id:item.id}); toast("삭제했습니다.");
  }
  render(true);
});

/* ---------- 데이터 내보내기 (CSV: 엑셀·구글시트·휴대폰 모두 열림) ---------- */
$("#exportBtn").addEventListener("click", ()=>{
  const list = (window.__shown && window.__shown.length) ? window.__shown : items;
  if (!list.length){ toast("내보낼 기록이 없습니다."); return; }
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const p = n => String(n).padStart(2,"0");
  const dt = t => { const d = new Date(t); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  const rows = [["입고시간","형번","로트","시리얼","1차","2차","3차","판정","비고"]];
  [...list].sort((a,b)=>a.scannedAt-b.scannedAt).forEach(i=>{
    const r = i.results||[];
    rows.push([dt(i.scannedAt), i.model, i.lot, i.serial, r[0]||"", r[1]||"", r[2]||"", LABEL[status(r)], i.note||""]);
  });
  // 형번·로트가 숫자/날짜로 바뀌지 않도록 ="..." 형태로 저장
  const csv = "﻿" + rows.map((r,ri)=>r.map((v,ci)=> ri>0 && (ci===1||ci===2) ? `="${String(v).replace(/"/g,'""')}"` : q(v)).join(",")).join("\r\n");
  const now = new Date();
  const name = `샘플시험기록_${now.getFullYear()}${p(now.getMonth()+1)}${p(now.getDate())}_${p(now.getHours())}${p(now.getMinutes())}.csv`;
  try{
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast(`${list.length}건 내보냄 (${name})`);
  }catch(e){ toast("파일을 만들지 못했습니다."); }
});
// 구글 시트 / xlsx 링크 (시트 주인 계정으로 로그인되어 있어야 열림)
async function loadLinks(){
  if (MODE === "demo") return;
  try{
    const r = await callServer({action:"info"});
    if (r && r.ok && r.sheetUrl){
      $("#sheetLink").href = r.sheetUrl; $("#xlsxLink").href = r.xlsxUrl;
      $("#exportLinks").hidden = false;
    }
  }catch(e){}
}

let tt = null;
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(()=>el.hidden = true, 2600); }

if (MODE === "demo"){
  const b = $("#banner"); b.hidden = false;
  b.textContent = "체험 모드: 아직 구글 시트와 연결되지 않아 이 기기에만 저장됩니다. (SCRIPT_URL 설정 필요)";
}
// 다른 사람 기록 받아오기: 20초마다 (저장 중·입력 중엔 건너뜀)
setInterval(()=>{ if (!document.hidden && $("#live").hidden && !batchRunning) refresh(); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) refresh(); });

// 해독 기능 상태 표시
(async function diag(){
  const parts = [];
  const det = await getNativeDetector();
  let sup = [];
  if ("BarcodeDetector" in window){ try{ sup = await BarcodeDetector.getSupportedFormats(); }catch(e){} }
  parts.push("내장 " + (det ? "✓" : "✗") + (sup.length ? "(" + (sup.includes("data_matrix") ? "DM" : "noDM") + ")" : ""));
  let zx = "✗";
  if (window.ZXingWASM){
    try{
      const c = document.createElement("canvas"); c.width = c.height = 8;
      await ZXingWASM.readBarcodes(c.getContext("2d").getImageData(0,0,8,8), ZX_OPTS);
      zx = "✓";
    }catch(e){ zx = "✗(" + String(e && e.message || e).slice(0,40) + ")"; }
  } else zx = "✗(미로드)";
  parts.push("zxing " + zx);
  parts.push("jsQR " + (window.jsQR ? "✓" : "✗"));
  $("#diag").textContent = "v5 · " + parts.join(" · ");
})();
window.__test = {parseQR, status, demoApi};
refresh(true);
loadLinks();
})();
